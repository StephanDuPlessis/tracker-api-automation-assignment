# Azure Pipelines: runs the API test suite on a Microsoft-hosted Ubuntu agent.

# Run on every push to main.
trigger:
  - main

# Choices shown when the pipeline is run by hand ("Run pipeline"). Pushes always use the default.
parameters:
  - name: runFailureDemo
    displayName: Also run the failure demo (this run will fail on purpose)
    type: boolean
    default: false

# A Microsoft-hosted Linux agent (a fresh virtual machine for every run).
pool:
  vmImage: ubuntu-latest

variables:
  # Tool versions in one place, so they are easy to find and change.
  sqlcmdVersion: v1.10.0
  newmanVersion: 6.2.3
  htmlextraVersion: 1.23.1
  # Where the API listens. The run script starts the API on the agent, so this is local.
  # Change it here if the API should listen somewhere else.
  BASE_URL: http://localhost:5080
  # Database settings. Plain variables become environment variables in every step.
  # The password is a secret variable (DB_PASSWORD) created in the pipeline's settings, not in this file.
  DB_SERVER: localhost
  DB_NAME: PositionsDb
  DB_USER: sa

# SQL Server in a Docker container: started before the steps, removed after the job.
resources:
  containers:
    - container: sqlserver
      image: mcr.microsoft.com/mssql/server:2022-latest
      env:
        ACCEPT_EULA: 'Y'
        MSSQL_SA_PASSWORD: $(DB_PASSWORD)
      ports:
        - 1433:1433

jobs:
  - job: Tests
    services:
      sql: sqlserver
    steps:
      # Get the code from the repo. This is the default, shown here to make it explicit.
      - checkout: self

      # The agent has several SDKs and "dotnet" would pick the newest (a preview). The API targets .NET 9.
      - task: UseDotNet@2
        displayName: Use the .NET 9 SDK
        inputs:
          packageType: sdk
          version: 9.0.x

      # sqlcmd is not on the agent. Download the standalone Linux build (one file, no apt repository needed).
      # "##vso[task.prependpath]" adds the folder to the PATH for the steps that come after this one.
      - script: |
          mkdir -p "$HOME/sqlcmd"
          curl -sSL "https://github.com/microsoft/go-sqlcmd/releases/download/$(sqlcmdVersion)/sqlcmd-linux-amd64.tar.bz2" \
            | tar -xj -C "$HOME/sqlcmd" sqlcmd
          echo "##vso[task.prependpath]$HOME/sqlcmd"
        displayName: Install sqlcmd

      # Pinned versions, so a new release cannot change the result of a run.
      - script: sudo npm install --global newman@$(newmanVersion) newman-reporter-htmlextra@$(htmlextraVersion)
        displayName: Install Newman and the htmlextra reporter

      # Check: print the version of every tool the next steps use.
      - script: |
          dotnet --version
          sqlcmd --version
          newman --version
          npm ls --global --depth=0
        displayName: Check the installed tools

      # SQL Server needs a few seconds to start. Try to log in every 2 seconds, for up to 60 seconds.
      # Secret variables are not passed to scripts automatically, so the password is mapped in "env".
      - script: |
          for i in $(seq 1 30); do
            sqlcmd -S "$DB_SERVER" -U "$DB_USER" -C -Q "SELECT 1" > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "SQL Server did not accept a login within 60 seconds." >&2
          exit 1
        displayName: Wait for SQL Server
        env:
          SQLCMDPASSWORD: $(DB_PASSWORD)

      # Create the database and tables, then load the seed data. -b makes sqlcmd fail the step on a SQL error.
      - script: |
          sqlcmd -S "$DB_SERVER" -U "$DB_USER" -C -b -i db/01_schema.sql
          sqlcmd -S "$DB_SERVER" -U "$DB_USER" -C -b -d "$DB_NAME" -i db/02_seed.sql
        displayName: Apply the schema and the seed data
        env:
          SQLCMDPASSWORD: $(DB_PASSWORD)

      # Run the whole suite: reset the data, start the API, run Newman, stop the API.
      # The script's exit code is Newman's, so a failed test fails this step and the pipeline.
      # Secret variables are not passed to scripts automatically, so both are mapped in "env".
      - script: bash scripts/tests/run-tests.sh
        displayName: Run the API tests
        env:
          API_KEY: $(API_KEY)
          DB_PASSWORD: $(DB_PASSWORD)

      # Only when "Also run the failure demo" is ticked: run the demo collection, which has tests that
      # fail and are skipped on purpose. It fails this step and the pipeline, to show what a failing run
      # looks like. The steps below still publish everything, because they use "condition: always()".
      - ${{ if eq(parameters.runFailureDemo, true) }}:
          - script: bash scripts/tests/run-tests.sh demo
            displayName: Run the failure demo (fails on purpose)
            env:
              API_KEY: $(API_KEY)
              DB_PASSWORD: $(DB_PASSWORD)

                # The next three steps use "condition: always()", so they run even when the tests failed.

      # Remove the test data (everything with the TEST- and pos-test- prefixes).
      - script: sqlcmd -S "$DB_SERVER" -U "$DB_USER" -C -b -d "$DB_NAME" -i db/99_cleanup.sql
        displayName: Clean up the test data
        condition: always()
        env:
          SQLCMDPASSWORD: $(DB_PASSWORD)

      # Show the Newman results on the run's Tests tab (Newman writes them as JUnit XML).
      # The "Run the API tests" step already fails the pipeline when a test fails.
      - task: PublishTestResults@2
        displayName: Publish the test results
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: tests/reports/newman-junit.xml
          testRunTitle: API tests (Newman)

      # The failure demo's results, shown as their own test run. Only added when the demo is ticked.
      - ${{ if eq(parameters.runFailureDemo, true) }}:
          - task: PublishTestResults@2
            displayName: Publish the failure demo results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: tests/reports/newman-demo-junit.xml
              testRunTitle: Failure demo (deliberate failures)

      # Keep the reports folder (the HTML report, the JUnit XML and the API log) as a downloadable artifact.
      - task: PublishPipelineArtifact@1
        displayName: Publish the HTML report
        condition: always()
        inputs:
          targetPath: tests/reports
          artifact: test-reports
